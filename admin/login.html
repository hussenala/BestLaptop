<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="site-url" content="https://way-company.com" />
    <title>دخول لوحة التحكم | BEST LAPTOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="../img/logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="../css/styles.css?v=16" />
    <link rel="stylesheet" href="css/admin.css?v=44" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("bestlaptop-theme") === "light" ? "light" : "dark";
    </script>
  </head>
  <body class="admin-login-body">
    <main class="login-wrap">
      <button class="icon-btn login-theme-btn" type="button" data-theme-toggle aria-label="تبديل المظهر">فاتح</button>
      <form class="login-card is-checking" data-login>
        <div class="login-brand">
          <img src="../img/logo.jpg" alt="BEST LAPTOP" />
          <div>
            <strong>BEST LAPTOP</strong>
            <small>بيست لابتوب</small>
          </div>
        </div>
        <div class="login-head">
          <p class="eyebrow">لوحة التحكم</p>
          <h1>تسجيل الدخول</h1>
          <p class="muted login-lead">أدخل بياناتك للوصول إلى إدارة المتجر والطلبات.</p>
        </div>
        <p class="login-warn" data-login-warn hidden></p>
        <label>
          اسم المستخدم
          <input name="username" required autocomplete="username" placeholder="اكتب اسم المستخدم" />
        </label>
        <label class="login-pass-label">
          كلمة المرور
          <span class="login-pass-field">
            <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••" data-login-pass />
            <button class="login-pass-toggle" type="button" data-toggle-pass aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
          </span>
        </label>
        <p class="login-error" data-login-error hidden>بيانات الدخول غير صحيحة.</p>
        <button class="btn btn-primary btn-lg" type="submit" data-login-submit>دخول</button>
        <a class="login-back" href="../index.html">العودة للمتجر ←</a>
      </form>
    </main>
    <script src="../js/api-client.js?v=48"></script>
    <script src="../js/store-db.js?v=48"></script>
    <script src="../js/theme.js"></script>
    <script>
      const form = document.querySelector("[data-login]");
      const err = document.querySelector("[data-login-error]");
      const warn = document.querySelector("[data-login-warn]");
      const submitBtn = document.querySelector("[data-login-submit]");

      document.querySelector("[data-toggle-pass]")?.addEventListener("click", (e) => {
        const btn = e.currentTarget;
        const input = document.querySelector("[data-login-pass]");
        if (!input) return;
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "إخفاء" : "إظهار";
        btn.setAttribute("aria-pressed", String(show));
        btn.setAttribute("aria-label", show ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = "جاري الدخول…";
        err.hidden = true;
        StoreDB.login(form.username.value, form.password.value)
          .then(() => location.replace("index.html"))
          .catch((error) => {
            err.hidden = false;
            err.textContent =
              error.message === "Invalid credentials"
                ? "بيانات الدخول غير صحيحة."
                : error.message || "تعذر تسجيل الدخول.";
            submitBtn.disabled = false;
            submitBtn.textContent = "دخول";
          });
      });

      void (async () => {
        try {
          const user = await StoreDB.verifySession();
          if (user) {
            location.replace("index.html");
            return;
          }
          const { res, body } = await StoreAPI.fetchApi("/api/health", { cache: "no-store" });
          if (!res.ok || !body?.db) {
            warn.hidden = false;
            warn.textContent = "تعذر الاتصال بقاعدة البيانات. تحقق من تفعيل PHP و SQLite على الاستضافة وملف api/index.php.";
          } else if (!body.hasAdmin) {
            warn.hidden = false;
            warn.textContent = "لا يوجد حساب أدمن في قاعدة البيانات. أعد نشر الموقع أو عيّن STORE_ADMIN_USER و STORE_ADMIN_PASSWORD.";
          }
        } catch {
          warn.hidden = false;
          warn.textContent =
            "تعذر الوصول لواجهة /api. تأكد من رفع api/index.php و .htaccess وتفعيل PDO SQLite في hPanel.";
        } finally {
          form.classList.remove("is-checking");
        }
      })();
    </script>
  </body>
</html>
