<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دخول لوحة التحكم | BEST LAPTOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="../img/logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="../css/styles.css?v=16" />
    <link rel="stylesheet" href="css/admin.css?v=20" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("bestlaptop-theme") === "light" ? "light" : "dark";
    </script>
  </head>
  <body class="admin-login-body">
    <main class="login-wrap">
      <form class="login-card" data-login>
        <img src="../img/logo.jpg" alt="BEST LAPTOP" />
        <p class="eyebrow">لوحة التحكم</p>
        <h1>تسجيل الدخول</h1>
        <label>اسم المستخدم<input name="username" required autocomplete="username" /></label>
        <label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" /></label>
        <p class="login-error" data-login-error hidden>بيانات الدخول غير صحيحة.</p>
        <button class="btn btn-primary btn-lg" type="submit">دخول</button>
        <p class="muted demo-hint">تجريبي: admin / admin123 · المدير: manager / manager123</p>
        <a class="muted" href="../index.html">العودة للمتجر</a>
      </form>
    </main>
    <script src="../js/data.js?v=20"></script>
    <script src="../js/api-client.js?v=20"></script>
    <script src="../js/store-db.js?v=20"></script>
    <script src="../js/theme.js"></script>
    <script>
      if (StoreDB.session()) location.replace("index.html");
      document.querySelector("[data-login]").addEventListener("submit", (e) => {
        e.preventDefault();
        const err = document.querySelector("[data-login-error]");
        const btn = e.target.querySelector("button[type=submit]");
        btn.disabled = true;
        StoreDB.login(e.target.username.value, e.target.password.value)
          .then(() => location.replace("index.html"))
          .catch(() => {
            err.hidden = false;
            btn.disabled = false;
          });
      });
    </script>
  </body>
</html>
